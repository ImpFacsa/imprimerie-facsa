name: Maintien Supabase actif

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets SUPABASE_URL et SUPABASE_KEY manquants."
            exit 1
          fi
          code=$(curl -s -o reponse.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Code HTTP : $code — réponse : $(cat reponse.txt)"
          test "$code" = "200"

      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Trace mensuelle
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > .github/dernier-passage.txt
            git config user.name  "maintien-supabase"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/dernier-passage.txt
            git commit -m "Maintien automatique : trace mensuelle" || true
            git push
          else
            echo "Pas de trace aujourd'hui."
          fi
