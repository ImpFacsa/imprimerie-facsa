<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Mise en page : bandeau d'en-tête sobre, onglets, puis espace de travail en deux colonnes (liste / détail) qui passe en une colonne sur mobile */
:root{
  --paper:#F5F6F8; --sheet:#FFFFFF; --ink:#18212E; --ink-2:#4A5566; --ink-3:#7A8496;
  --rule:#DDE1E7; --rule-2:#EBEEF2; --accent:#1C5D8C; --accent-ink:#FFFFFF; --accent-soft:#E6EFF6;
  --ok:#2F7A4D; --ok-soft:#E4F2E9; --warn:#A8620B; --warn-soft:#FBF0DF; --bad:#B23A3A; --bad-soft:#F8E5E5; --prod:#6B4BA8; --prod-soft:#EEE8F7;
  --f-display:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161E; --sheet:#18202B; --ink:#E8ECF1; --ink-2:#B3BCC8; --ink-3:#8590A0;
  --rule:#2B3542; --rule-2:#222B37; --accent:#6FA8D6; --accent-ink:#0D1620; --accent-soft:#1D2E3F;
  --ok:#6CC08E; --ok-soft:#1B3326; --warn:#E3A44F; --warn-soft:#382A16; --bad:#E57D7D; --bad-soft:#3A1F21; --prod:#B39AE6; --prod-soft:#2B2340;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11161E; --sheet:#18202B; --ink:#E8ECF1; --ink-2:#B3BCC8; --ink-3:#8590A0;
  --rule:#2B3542; --rule-2:#222B37; --accent:#6FA8D6; --accent-ink:#0D1620; --accent-soft:#1D2E3F;
  --ok:#6CC08E; --ok-soft:#1B3326; --warn:#E3A44F; --warn-soft:#382A16; --bad:#E57D7D; --bad-soft:#3A1F21; --prod:#B39AE6; --prod-soft:#2B2340;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
header.top{background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:18px;flex-wrap:wrap}
.logo{width:56px;height:56px;flex:none;color:var(--ink);display:grid;place-items:center}
.logo .mark{display:block;width:100%;height:100%;background:var(--ink);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.brand{min-width:0;flex:1}
.brand .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.brand h1{font-size:clamp(20px,3vw,26px);font-weight:800;line-height:1.15}
.brand h1 span{color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.role{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-weight:600;font-size:12.5px}
.role i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}

/* Onglets */
nav.tabs{border-bottom:1px solid var(--rule);background:var(--sheet)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:14px 14px 12px;font-family:var(--f-display);font-weight:600;font-size:14.5px;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 7px}

main{padding-block:28px 64px}
.notice{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:14px 16px;color:var(--ink-2);margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--rule));background:var(--warn-soft);color:var(--ink)}
.notice b{color:var(--ink)}

/* Formulaire */
.form-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:24px}
.panel h2{font-size:18px;font-weight:700;margin-bottom:4px}
.panel .sub{color:var(--ink-3);font-size:14px;margin:0 0 20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label.lbl,.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lbl em{font-style:normal;color:var(--bad);margin-left:2px}
.lbl small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3);margin-left:4px;font-size:12.5px}
.input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:10px 12px;min-height:44px;transition:border-color .15s,background .15s}
.input:hover{border-color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--accent);background:var(--sheet);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:120px;resize:vertical}
.input.err{border-color:var(--bad)}
.errmsg{color:var(--bad);font-size:13px;min-height:0}
.qty{display:flex;align-items:stretch}
.qty .input{border-radius:8px 0 0 8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.qty span{display:grid;place-items:center;padding:0 12px;border:1px solid var(--rule);border-left:0;border-radius:0 8px 8px 0;color:var(--ink-3);font-size:13.5px;background:var(--rule-2)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 13px;border:1px solid var(--rule);border-radius:999px;font-size:14px;background:var(--paper);cursor:pointer;transition:all .15s}
.chip input:hover+span{border-color:var(--ink-3)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.drop{border:1.5px dashed var(--rule);border-radius:var(--r);padding:26px 16px;text-align:center;background:var(--paper);cursor:pointer;transition:all .15s;position:relative}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop svg{width:34px;height:34px;color:var(--accent);margin-bottom:6px}
.drop strong{display:block;font-family:var(--f-display);font-size:15px}
.drop p{margin:4px 0 0;color:var(--ink-3);font-size:13px}
.drop.disabled{opacity:.6;cursor:not-allowed}
.flist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);min-width:0}
.ftype{flex:none;width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em}
.ftype.pdf{background:var(--bad-soft);color:var(--bad)}
.ftype.img{background:var(--accent-soft);color:var(--accent)}
.fmeta{min-width:0;flex:1}
.fname{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsize{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.iconbtn{appearance:none;border:1px solid transparent;background:none;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--ink-3);flex:none}
.iconbtn:hover{background:var(--rule-2);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

.btn{appearance:none;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:10px 16px;min-height:42px;font-family:var(--f-display);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--rule))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{min-height:34px;padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.submitbar{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule-2);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.submitbar .hint{font-size:13px;color:var(--ink-3)}
.progress{font-size:13.5px;color:var(--ink-2)}

.recap dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.recap dt{color:var(--ink-3)}
.recap dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.recap .sep{grid-column:1/-1;border-top:1px solid var(--rule-2);margin:4px 0}

.success{text-align:center;padding:40px 24px}
.success .num{font-family:var(--f-mono);font-size:22px;color:var(--accent);margin:8px 0 6px;letter-spacing:.02em}
.success .tick{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.success .tick svg{width:28px;height:28px}
.success p{color:var(--ink-2);max-width:46ch;margin:0 auto 18px}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
.stat .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.stat.hl .v{color:var(--accent)}

/* Liste + détail */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{appearance:none;border:0;background:none;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);font-weight:600}
.search{flex:1;min-width:160px}
.search .input{min-height:36px;padding:7px 12px}
.olist{display:flex;flex-direction:column;gap:8px}
.ocard{appearance:none;text-align:left;width:100%;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;transition:border-color .15s,box-shadow .15s}
.ocard:hover{border-color:var(--ink-3)}
.ocard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ocard .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.ocard .c{font-family:var(--f-display);font-weight:700;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .d{font-size:13.5px;color:var(--ink-2);grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap}
.ocard .d b{font-weight:600;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;align-self:start}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-recue{background:var(--accent-soft);color:var(--accent)}
.s-en_production{background:var(--prod-soft);color:var(--prod)}
.s-prete{background:var(--warn-soft);color:var(--warn)}
.s-livree{background:var(--ok-soft);color:var(--ok)}
.s-annulee{background:var(--rule-2);color:var(--ink-3)}
.flag{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.flag.late{background:var(--bad-soft);color:var(--bad)}
.flag.soon{background:var(--warn-soft);color:var(--warn)}

.detail{position:sticky;top:16px}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--rule-2);margin-bottom:16px}
.dhead .n{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.dhead h2{font-size:21px;margin-top:2px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kv div{min-width:0}
.kv .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kv .v{font-weight:600;overflow-wrap:anywhere}
.kv .v.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.block{margin-bottom:18px}
.block .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.desc{white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule-2);border-radius:8px;padding:12px 14px;font-size:14.5px;overflow-wrap:anywhere}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{appearance:none;border:1px solid var(--rule);background:var(--sheet);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.steps button:hover{border-color:var(--ink-3)}
.steps button[aria-pressed="true"]{border-color:transparent;font-weight:700}
.steps button[aria-pressed="true"].s-recue{background:var(--accent-soft);color:var(--accent)}
.steps button[aria-pressed="true"].s-en_production{background:var(--prod-soft);color:var(--prod)}
.steps button[aria-pressed="true"].s-prete{background:var(--warn-soft);color:var(--warn)}
.steps button[aria-pressed="true"].s-livree{background:var(--ok-soft);color:var(--ok)}
.steps button[aria-pressed="true"].s-annulee{background:var(--rule-2);color:var(--ink)}
.dfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding-top:16px;border-top:1px solid var(--rule-2)}
.empty{text-align:center;padding:48px 24px;color:var(--ink-3);background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.empty svg{width:40px;height:40px;color:var(--ink-3);margin-bottom:10px}

/* Suivi client */
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.track div{height:5px;border-radius:3px;background:var(--rule)}
.track div.on{background:var(--accent)}
.track-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mycard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px}
.mylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--sheet);padding:11px 18px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-mono)}
footer{border-top:1px solid var(--rule);padding-block:18px;font-size:12.5px;color:var(--ink-3)}
footer .wrap{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.linkbtn{appearance:none;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

@media (max-width:900px){
  .form-grid,.board{grid-template-columns:minmax(0,1fr)}
  .detail{position:static}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .fields{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .panel{padding:18px}
  .who .label{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Ajouts version autonome */
.login{max-width:420px;margin:24px auto}
.login .field{margin-bottom:16px}
.login .actions{justify-content:space-between}
.meter{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;margin-bottom:22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.meter .info{flex:1;min-width:220px}
.meter .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.meter .t{font-size:14px;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--rule-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.warn span{background:var(--warn)}
.bar.full span{background:var(--bad)}
.gone{font-size:12.5px;color:var(--ink-3);font-style:italic;white-space:nowrap}
.copyrow{display:flex;gap:8px;max-width:520px;margin:0 auto 18px}
.copyrow .input{font-family:var(--f-mono);font-size:12.5px;min-height:38px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.userbar{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
</style>

    : [["new","Nouvelle commande"],["mine","Mes commandes",S.mine.length||null]].concat(S.tab==="login"?[["login","Espace imprimerie"]]:[]);
  if(!tabs.find(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  $("#tabs").innerHTML = tabs.map(([k,l,c])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}${c?`<span class="count">${c}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.done=null; render(); });
  $("#roleText").textContent = S.admin? "Espace imprimerie" : "Commande en ligne";
  const ub=$("#userbar");
  if(S.admin) ub.innerHTML=`<span>${esc(S.session?.user?.email||"")}</span><button class="linkbtn" id="logout">Se déconnecter</button>`;
  else ub.innerHTML=`<button class="linkbtn" id="toLogin">Espace imprimerie</button>`;
  const lo=$("#logout"); if(lo) lo.onclick=async()=>{ await sb.auth.signOut(); toast("Vous êtes déconnecté"); };
  const tl=$("#toLogin"); if(tl) tl.onclick=()=>{ S.tab="login"; render(); window.scrollTo(0,0); };
}
function render(){ renderTabs(); const m=$("#main");
  if(S.tab==="orders") renderOrders(m); else if(S.tab==="mine") renderMine(m); else if(S.tab==="login") renderLogin(m); else renderForm(m); }

  if(!window.supabase) return `<div class="notice warn"><div><b>Connexion impossible.</b> Vérifiez votre connexion Internet puis rechargez la page.</div></div>`;

}

const getType=()=>{ const r=document.querySelector('input[name=type]:checked'); return r?r.value:""; };
function readForm(){ const v=id=>($("#"+id)?.value||"").trim();
  return {commanditaire:v("commanditaire"),responsable:v("responsable"),contact:v("contact"),type:getType(),typeAutre:v("typeAutre"),quantite:v("quantite"),dateLivraison:v("dateLivraison"),format:v("format"),description:v("description")}; }
function updRecap(){ const o=readForm(); const el=$("#recap"); if(!el) return;
  const row=(k,v)=>`<dt>${k}</dt><dd>${v?esc(v):'<span class="muted" style="font-weight:400">—</span>'}</dd>`;
  el.innerHTML=row("Commanditaire",o.commanditaire)+row("Travaux",o.type==="Autre"?(o.typeAutre||"Autre"):o.type)+row("Quantité",o.quantite?qtyFmt(o.quantite)+" ex.":"")+row("Livraison",o.dateLivraison?fmtDate(o.dateLivraison):"")+'<div class="sep"></div>'+row("Fichiers",S.files.length?S.files.length+" fichier"+(S.files.length>1?"s":"")+" · "+fmtSize(S.files.reduce((a,f)=>a+f.size,0)):""); }
function addFiles(list){
  for(const f of list){ const e=ext(f.name);
    if(!MIME[e]){ toast(`« ${f.name} » n'est pas un PDF, JPEG ou PNG`); continue; }
    if(f.size>MAX){ toast(`« ${f.name} » dépasse 20 Mo`); continue; }
    if(!f.size || S.files.some(x=>x.name===f.name&&x.size===f.size)) continue;
    S.files.push(f); }
  renderFiles(); updRecap(); }
function fileRow(name,size,extra=""){ const e=ext(name); return `<li class="fitem"><div class="ftype ${e==="pdf"?"pdf":"img"}">${esc(e.toUpperCase())}</div><div class="fmeta"><div class="fname" title="${esc(name)}">${esc(name)}</div><div class="fsize">${fmtSize(size)}</div></div>${extra}</li>`; }
function renderFiles(){ const ul=$("#flist"); if(!ul) return;
  ul.innerHTML=S.files.map((f,i)=>fileRow(f.name,f.size,`<button type="button" class="iconbtn" data-rm="${i}" aria-label="Retirer ${esc(f.name)}">${ICON.x}</button>`)).join("");
  ul.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ S.files.splice(+b.dataset.rm,1); renderFiles(); updRecap(); }); }

async function submitOrder(){
  if(S.sending) return;
  const o=readForm(); let bad=false;
  const err=(id,msg)=>{ const e=$("#e-"+id); if(e) e.textContent=msg||""; const i=$("#"+id); if(i) i.classList.toggle("err",!!msg); if(msg) bad=true; };
  err("commanditaire", o.commanditaire?"":"Indiquez le nom du commanditaire.");
  err("type", !o.type?"Choisissez un type de travaux.":(o.type==="Autre"&&!o.typeAutre?"Précisez le type de travaux.":""));
  const q=parseInt(o.quantite,10); err("quantite", q>0&&q<=1000000?"":"Indiquez une quantité entre 1 et 1 000 000.");
  err("dateLivraison", !o.dateLivraison?"Choisissez une date de livraison.":(o.dateLivraison<todayISO()?"La date ne peut pas être passée.":""));
  if(bad){ document.querySelector(".input.err")?.focus(); return; }
  if(!sb){ toast("Le site n'est pas encore relié à Supabase"); return; }
  const id=uuid(), suivi=uuid();
  const order={id,suivi,num:newNum(),commanditaire:o.commanditaire,responsable:o.responsable,contact:o.contact,type:o.type,typeAutre:o.type==="Autre"?o.typeAutre:"",quantite:q,dateLivraison:o.dateLivraison,format:o.format,description:o.description,fichiers:[],statut:"recue",creeLe:new Date().toISOString()};
  if($("#site_web").value){ S.done=order; render(); return; } // robot
  S.sending=true; const btn=$("#send"), pg=$("#progress"); btn.disabled=true;
  try{
    for(let i=0;i<S.files.length;i++){ const f=S.files[i], type=MIME[ext(f.name)];
      pg.textContent=`Envoi du fichier ${i+1}/${S.files.length}…`;
      const path=`${id}/${i+1}-${safeName(f.name)}`;
      const {error}=await sb.storage.from("fichiers").upload(path,f,{contentType:type,upsert:false});
      if(error) throw {where:"upload",error};
      order.fichiers.push({path,nom:f.name,taille:f.size,type});
    }
    pg.textContent="Enregistrement…";
    for(let attempt=0;attempt<2;attempt++){
      const {error}=await sb.from("commandes").insert({id,suivi,num:order.num,commanditaire:order.commanditaire,responsable:order.responsable,contact:order.contact,type:order.type,type_autre:order.typeAutre,quantite:order.quantite,date_livraison:order.dateLivraison,format:order.format,description:order.description,fichiers:order.fichiers});
      if(!error) break;
      if(error.code==="23505" && attempt===0){ order.num=newNum(); continue; }
      throw {where:"insert",error};
    }
    S.files=[]; try{ localStorage.removeItem(LS_DRAFT); }catch(e){}
    S.mine=[{...order},...S.mine]; lsSet(LS_MINE,S.mine);
    S.done=order; toast("Commande envoyée"); render(); window.scrollTo(0,0);
  }catch(e){
    console.error(e);
    const msg=String(e?.error?.message||"");
    if(/size|large|exceed/i.test(msg)) toast("Un fichier est trop volumineux (20 Mo max)");
    else if(/quota|storage limit/i.test(msg)) toast("L'espace de stockage de l'imprimerie est plein. Prévenez le service imprimerie.");
    else toast("L'envoi a échoué. Vérifiez votre connexion puis réessayez.");
    pg.textContent=""; btn.disabled=false;
  } finally { S.sending=false; }
}

/* ---------- Mes commandes (client, sans compte) ---------- */
async function refreshMine(){
  if(!sb || !S.mine.length) return;
  let changed=false;
  for(const o of S.mine){ const {data,error}=await sb.rpc("suivi_commande",{p_suivi:o.suivi});
    if(!error && data && data[0]){ if(o.statut!==data[0].statut){ o.statut=data[0].statut; changed=true; } }
    else if(!error && data && !data[0] && !o.introuvable){ o.introuvable=true; changed=true; } }
  if(changed){ lsSet(LS_MINE,S.mine); if(S.tab==="mine") renderMine($("#main")); }
}
async function addTracking(code){
  const s=(code.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i)||[])[0];
  if(!s){ toast("Ce lien de suivi n'est pas valide"); return false; }
  if(S.mine.some(o=>o.suivi===s)) return true;
  const {data,error}=await sb.rpc("suivi_commande",{p_suivi:s});
  if(error||!data||!data[0]){ toast("Commande introuvable"); return false; }
  const r=data[0];
  S.mine=[{suivi:s,num:r.num,statut:r.statut,type:r.type,typeAutre:r.type_autre,quantite:r.quantite,dateLivraison:r.date_livraison,commanditaire:r.commanditaire,fichiers:[],partiel:true},...S.mine];
  lsSet(LS_MINE,S.mine); return true;
}
function renderMine(m){
  if(!S.mineRefreshed){ S.mineRefreshed=true; refreshMine(); }
  const finder=`<div class="panel" style="margin-top:20px"><h2 style="font-size:16px">Suivre une autre commande</h2><p class="sub" style="margin-bottom:12px">Collez le lien de suivi reçu après l'envoi.</p>
    <form id="find" class="copyrow" style="margin:0;max-width:none"><input class="input" id="findIn" placeholder="https://…?suivi=…" aria-label="Lien de suivi"><button class="btn small" type="submit">Ajouter</button></form></div>`;
  if(!S.mine.length){ m.innerHTML=setupNotice()+`<div class="empty">${ICON.inbox}<strong>Aucune commande sur cet appareil</strong>Les commandes envoyées depuis ce navigateur apparaissent ici, avec leur avancement.<div style="margin-top:16px"><button class="btn primary" id="goNew">Passer une commande</button></div></div>`+finder; $("#goNew").onclick=()=>{ S.tab="new"; render(); }; }
  else m.innerHTML=`<div class="mylist">${S.mine.map((o,i)=>{ const idx=STEP_ORDER.indexOf(o.statut);
    return `<article class="mycard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="min-width:0"><div class="mono muted" style="font-size:12px">${esc(o.num)}</div><h3 style="font-size:16px;margin-top:2px">${esc(typeLabel(o))} · ${qtyFmt(o.quantite)} ex.</h3></div>${o.introuvable?'<span class="pill s-annulee">Supprimée</span>':`<span class="pill s-${esc(o.statut)}">${STATUTS[o.statut]?.l||""}</span>`}</div>
      <div class="muted" style="font-size:13.5px;margin-top:6px">${esc(o.commanditaire)} · livraison le ${fmtDate(o.dateLivraison)}</div>
      ${o.statut==="annulee"||o.introuvable?"":`<div class="track">${STEP_ORDER.map((s,j)=>`<div class="${j<=idx?"on":""}"></div>`).join("")}</div><div class="track-l">${STEP_ORDER.map(s=>`<span>${STATUTS[s].l.replace(" à retirer","")}</span>`).join("")}</div>`}
      <div class="actions" style="margin-top:12px">${o.partiel?"":`<button class="btn small" data-pdf="${i}">${ICON.doc} Récapitulatif</button>`}<button class="btn small" data-cp="${i}">Copier le lien de suivi</button></div></article>`; }).join("")}</div>`+finder;
  m.querySelectorAll("[data-pdf]").forEach(b=>b.onclick=()=>savePdf(S.mine[+b.dataset.pdf]));
  m.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copyText(trackUrl(S.mine[+b.dataset.cp].suivi)));
  $("#find").onsubmit=async e=>{ e.preventDefault(); if(!sb) return; if(await addTracking($("#findIn").value)){ toast("Commande ajoutée"); renderMine(m); renderTabs(); } };
}

/* ---------- Connexion imprimerie ---------- */
function renderLogin(m){
  if(S.recovery){
    m.innerHTML=`<section class="panel login"><h2>Nouveau mot de passe</h2><p class="sub">Choisissez un mot de passe d'au moins 8 caractères.</p>
      <form id="rf"><div class="field"><label class="lbl" for="np">Nouveau mot de passe</label><input class="input" id="np" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="errmsg" style="margin-bottom:10px">${esc(S.loginMsg)}</div><div class="actions"><button class="btn primary" type="submit" style="flex:1">Enregistrer</button></div></form></section>`;
    $("#rf").onsubmit=async e=>{ e.preventDefault(); const {error}=await sb.auth.updateUser({password:$("#np").value});
      if(error){ S.loginMsg="Le mot de passe n'a pas pu être changé : "+error.message; render(); return; }
      S.recovery=false; S.loginMsg=""; toast("Mot de passe enregistré"); history.replaceState(null,"",location.pathname); await handleSession((await sb.auth.getSession()).data.session); };
    return;
  }
  m.innerHTML=setupNotice()+`<section class="panel login"><h2>Espace imprimerie</h2><p class="sub">Réservé à l'équipe du service imprimerie.</p>
    <form id="lf"><div class="field"><label class="lbl" for="em">E-mail</label><input class="input" id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label class="lbl" for="pw">Mot de passe</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
    <div class="errmsg" style="margin-bottom:10px" id="lmsg">${esc(S.loginMsg)}</div>
    <div class="actions"><button class="linkbtn" type="button" id="forgot">Mot de passe oublié ?</button><button class="btn primary" type="submit" id="lbtn">Se connecter</button></div></form></section>`;
  $("#lf").onsubmit=async e=>{ e.preventDefault(); if(!sb) return; $("#lbtn").disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){ S.loginMsg="E-mail ou mot de passe incorrect."; $("#lmsg").textContent=S.loginMsg; $("#lbtn").disabled=false; } };
  $("#forgot").onclick=async()=>{ const em=$("#em").value.trim(); if(!em){ $("#lmsg").textContent="Saisissez d'abord votre e-mail."; return; }
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    $("#lmsg").textContent = error? "L'e-mail n'a pas pu être envoyé. Réessayez dans quelques minutes." : "Si ce compte existe, un e-mail de réinitialisation vient d'être envoyé."; };
}
async function handleSession(session){
  S.session=session;
  if(session){
    const {data}=await sb.rpc("est_imprimerie");
    if(data===true){ if(!S.admin){ S.admin=true; S.loginMsg=""; if(!S.recovery) S.tab="orders"; startAdmin(); } }
    else { S.admin=false; S.loginMsg="Ce compte n'est pas autorisé à gérer les commandes."; await sb.auth.signOut(); }
  } else if(S.admin){ S.admin=false; stopAdmin(); S.tab="new"; }
  render();
}

/* ---------- Vue imprimerie ---------- */
function norm(r){ return {key:r.id,id:r.id,num:r.num,suivi:r.suivi,commanditaire:r.commanditaire,responsable:r.responsable,contact:r.contact,type:r.type,typeAutre:r.type_autre,quantite:r.quantite,dateLivraison:r.date_livraison,format:r.format,description:r.description,fichiers:Array.isArray(r.fichiers)?r.fichiers:[],fichiersSupprimesLe:r.fichiers_supprimes_le,statut:r.statut,note:r.note,creeLe:r.cree_le,majLe:r.maj_le}; }
async function loadOrders(){
  const {data,error}=await sb.from("commandes").select("*").order("cree_le",{ascending:false});
  if(error){ toast("Les commandes n'ont pas pu être chargées"); return; }
  S.all=data.map(norm);
  if(S.tab==="orders" && !document.activeElement?.matches("#note,#q")) render(); else renderTabs();
}
let reloadT; const scheduleReload=()=>{ clearTimeout(reloadT); reloadT=setTimeout(loadOrders,400); };
function startAdmin(){ loadOrders(); if(!S.channel) S.channel=sb.channel("commandes-imprimerie").on("postgres_changes",{event:"*",schema:"public",table:"commandes"},scheduleReload).subscribe(); }
function stopAdmin(){ if(S.channel){ sb.removeChannel(S.channel); S.channel=null; } S.all=[]; S.sel=null; }
window.addEventListener("focus",()=>{ if(S.admin) scheduleReload(); });

const liveFiles = o => (o.fichiers||[]).filter(f=>!f.supprime);
function flags(o){ if(["livree","annulee"].includes(o.statut)) return ""; const d=daysUntil(o.dateLivraison);
  if(d<0) return `<span class="flag late">En retard</span>`; if(d<=3) return `<span class="flag soon">${d===0?"Aujourd'hui":d===1?"Demain":"Sous "+d+" j"}</span>`; return ""; }
function filtered(){ let l=S.all;
  if(S.filter==="actives") l=l.filter(o=>["recue","en_production","prete"].includes(o.statut)); else if(S.filter!=="toutes") l=l.filter(o=>o.statut===S.filter);
  const q=S.q.toLowerCase(); if(q) l=l.filter(o=>[o.num,o.commanditaire,o.responsable,typeLabel(o),o.description].join(" ").toLowerCase().includes(q));
  if(S.filter==="actives") l=[...l].sort((a,b)=>a.dateLivraison.localeCompare(b.dateLivraison));
  return l; }
function meterHTML(){
  const used=S.all.reduce((a,o)=>a+liveFiles(o).reduce((x,f)=>x+(f.taille||0),0),0);
  const pct=Math.min(100,used/QUOTA_FICHIERS*100);
  const elig=S.all.filter(o=>["livree","annulee"].includes(o.statut)&&liveFiles(o).length);
  const eligSize=elig.reduce((a,o)=>a+liveFiles(o).reduce((x,f)=>x+(f.taille||0),0),0);
  const ask = S.confirm==="bulk";
  return `<div class="meter"><div class="info"><div class="k">Espace fichiers</div><div class="t"><b>${fmtSize(used)}</b> utilisés sur 1 Go (${pct.toFixed(0)} %)</div>
    <div class="bar ${pct>=95?"full":pct>=80?"warn":""}"><span style="width:${pct.toFixed(1)}%"></span></div></div>
    <div class="actions">${!elig.length?`<span class="muted" style="font-size:13.5px">Aucun fichier de commande livrée à supprimer</span>`
      : ask?`<span style="font-size:13.5px">Supprimer les fichiers de ${elig.length} commande${elig.length>1?"s":""} (${fmtSize(eligSize)}) ?</span><button class="btn small" id="bulkNo">Annuler</button><button class="btn small danger solid" id="bulkYes">Supprimer</button>`
      : `<button class="btn small" id="bulk">${ICON.trash} Libérer ${fmtSize(eligSize)} — fichiers des commandes livrées ou annulées</button>`}</div></div>`;
}
function renderOrders(m){
  const act=S.all.filter(o=>["recue","en_production","prete"].includes(o.statut));
  const list=filtered();
  if(S.sel && !S.all.find(o=>o.key===S.sel)) S.sel=null;
  if(!S.sel && list.length && matchMedia("(min-width:901px)").matches) S.sel=list[0].key;
  const sel=S.all.find(o=>o.key===S.sel);
  m.innerHTML=`
  <div class="stats">
    <div class="stat hl"><div class="k">À traiter</div><div class="v">${S.all.filter(o=>o.statut==="recue").length}</div></div>
    <div class="stat"><div class="k">En production</div><div class="v">${S.all.filter(o=>o.statut==="en_production").length}</div></div>
    <div class="stat"><div class="k">Prêtes à retirer</div><div class="v">${S.all.filter(o=>o.statut==="prete").length}</div></div>
    <div class="stat"><div class="k">À livrer sous 7 j</div><div class="v">${act.filter(o=>daysUntil(o.dateLivraison)<=7).length}</div></div>
  </div>
  ${meterHTML()}
  <div class="board">
    <section style="min-width:0">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Filtrer">${[["actives","En cours"],["livree","Livrées"],["annulee","Annulées"],["toutes","Toutes"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${l}</button>`).join("")}</div>
        <div class="search"><input class="input" id="q" type="search" placeholder="Rechercher…" value="${esc(S.q)}" aria-label="Rechercher une commande"></div>
      </div>
      <div class="olist">${ list.length? list.map(o=>`
        <button class="ocard" data-k="${esc(o.key)}" aria-current="${o.key===S.sel}">
          <div style="min-width:0"><div class="n">${esc(o.num)}</div><div class="c">${esc(o.commanditaire)}</div></div>
          <span class="pill s-${esc(o.statut)}">${STATUTS[o.statut]?.l||""}</span>
          <div class="d"><span><b>${qtyFmt(o.quantite)}</b> ex. · ${esc(typeLabel(o))}</span><span>Livraison <b>${fmtDateShort(o.dateLivraison)}</b></span>${flags(o)}${o.fichiers.length?`<span>${o.fichiers.length} fichier${o.fichiers.length>1?"s":""}${liveFiles(o).length?"":" (supprimés)"}</span>`:""}</div>
        </button>`).join("")
        : `<div class="empty">${ICON.inbox}<strong>${S.all.length?"Aucune commande dans cette vue":"Aucune commande pour l'instant"}</strong>${S.all.length?"Changez de filtre ou de recherche.":"Les demandes envoyées depuis le formulaire apparaîtront ici dès leur envoi."}</div>`}
      </div>
    </section>
    <section class="panel detail" id="detail" ${sel?"":"hidden"}>${sel?detailHTML(sel):""}</section>
  </div>`;
  m.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; S.sel=null; render(); });
  const qi=$("#q"); qi.oninput=()=>{ S.q=qi.value; const p=qi.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  m.querySelectorAll(".ocard").forEach(b=>b.onclick=()=>{ S.sel=b.dataset.k; S.confirm=null; render(); if(!matchMedia("(min-width:901px)").matches) $("#detail")?.scrollIntoView({behavior:"smooth"}); });
  const bk=$("#bulk"); if(bk) bk.onclick=()=>{ S.confirm="bulk"; render(); };
  const bn=$("#bulkNo"); if(bn) bn.onclick=()=>{ S.confirm=null; render(); };
  const by=$("#bulkYes"); if(by) by.onclick=bulkClean;
  if(sel) bindDetail(sel);
}
function detailHTML(o){
  const live=liveFiles(o);
  const conf = S.confirm;
  return `<div class="dhead"><div style="min-width:0"><div class="n">${esc(o.num)}</div><h2>${esc(o.commanditaire)}</h2>
      <div class="muted" style="font-size:13.5px">Reçue le ${fmtDateTime(o.creeLe)}</div></div>
      <span class="pill s-${esc(o.statut)}">${STATUTS[o.statut]?.l||""}</span></div>
    <div class="kv">
      <div><div class="k">Travaux</div><div class="v">${esc(typeLabel(o))}</div></div>
      <div><div class="k">Quantité</div><div class="v mono">${qtyFmt(o.quantite)} ex.</div></div>
      <div><div class="k">Livraison</div><div class="v">${fmtDate(o.dateLivraison)} ${flags(o)}</div></div>
      <div><div class="k">Contact</div><div class="v">${esc(o.responsable||"—")}</div></div>
      <div><div class="k">Téléphone / e-mail</div><div class="v">${esc(o.contact||"—")}</div></div>
      <div><div class="k">Format</div><div class="v">${esc(o.format||"—")}</div></div>
    </div>
    ${o.description?`<div class="block"><div class="k">Description</div><div class="desc">${esc(o.description)}</div></div>`:""}
    <div class="block"><div class="k"><span>Fichiers (${o.fichiers.length})</span><span class="actions">${live.length>1?`<button class="btn small" id="zipAll">${ICON.zip} Tout télécharger</button>`:""}${live.length?(conf==="files"?`<button class="btn small" id="fNo">Annuler</button><button class="btn small danger solid" id="fYes">Confirmer</button>`:`<button class="btn small danger" id="fDel">${ICON.trash} Supprimer les fichiers</button>`):""}</span></div>
      ${o.fichiers.length?`<ul class="flist" style="margin:0">${o.fichiers.map((f,i)=>fileRow(f.nom,f.taille,f.supprime?`<span class="gone">supprimé${o.fichiersSupprimesLe?" le "+fmtDateShort(o.fichiersSupprimesLe):""}</span>`:`<button class="btn small" data-dl="${i}" aria-label="Télécharger ${esc(f.nom)}">${ICON.dl} Télécharger</button>`)).join("")}</ul>`:`<div class="muted" style="font-size:14px">Aucun fichier joint.</div>`}
    </div>
    <div class="block"><div class="k">Avancement</div>
      <div class="steps">${Object.entries(STATUTS).map(([k,v])=>`<button class="s-${k}" data-st="${k}" aria-pressed="${o.statut===k}">${v.l}</button>`).join("")}</div></div>
    <div class="block"><label class="k" for="note">Note interne</label>
      <textarea class="input" id="note" style="min-height:70px" maxlength="2000" placeholder="Papier commandé, BAT validé, retrait par…">${esc(o.note||"")}</textarea></div>
    <div class="dfoot">
      <div class="actions"><button class="btn primary" id="print">${ICON.print} Imprimer la fiche</button><button class="btn" id="pdf">${ICON.doc} PDF</button></div>
      <div class="actions">${conf==="order"?`<span style="font-size:13.5px">Supprimer la commande et ses fichiers ?</span><button class="btn small" id="delNo">Annuler</button><button class="btn small danger solid" id="delYes">Supprimer</button>`:`<button class="btn danger small" id="del">${ICON.trash} Supprimer la commande</button>`}</div>
    </div>`;
}
function bindDetail(o){
  const upd=async(patch,okMsg)=>{ const {error}=await sb.from("commandes").update(patch).eq("id",o.id); if(error){ toast("L'enregistrement a échoué"); return false; } if(okMsg) toast(okMsg); return true; };
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{ if(b.dataset.st===o.statut) return;
    if(await upd({statut:b.dataset.st},"Statut : "+STATUTS[b.dataset.st].l)){ o.statut=b.dataset.st; render(); } });
  const note=$("#note"); let t; note.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>upd({note:note.value}),900); };
  note.onblur=()=>{ clearTimeout(t); if(note.value!==(o.note||"")) upd({note:note.value}).then(()=>{ o.note=note.value; }); };
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>downloadFile(o.fichiers[+b.dataset.dl],b));
  const z=$("#zipAll"); if(z) z.onclick=()=>downloadZip(o,z);
  $("#pdf").onclick=()=>savePdf(o); $("#print").onclick=()=>printPdf(o);
  const on=(id,fn)=>{ const e=$("#"+id); if(e) e.onclick=fn; };
  on("fDel",()=>{ S.confirm="files"; render(); }); on("fNo",()=>{ S.confirm=null; render(); }); on("fYes",()=>deleteFiles(o).then(()=>{ S.confirm=null; loadOrders(); }));
  on("del",()=>{ S.confirm="order"; render(); }); on("delNo",()=>{ S.confirm=null; render(); }); on("delYes",()=>deleteOrder(o));
}
async function deleteFiles(o,quiet){
  const live=liveFiles(o); if(!live.length) return true;
  const {error}=await sb.storage.from("fichiers").remove(live.map(f=>f.path));
  if(error){ if(!quiet) toast("Les fichiers n'ont pas pu être supprimés"); return false; }
  const fichiers=o.fichiers.map(f=>({...f,supprime:true}));
  const r=await sb.from("commandes").update({fichiers,fichiers_supprimes_le:new Date().toISOString()}).eq("id",o.id);
  if(r.error){ if(!quiet) toast("Les fichiers ont été supprimés, mais la commande n'a pas été mise à jour"); return false; }
  o.fichiers=fichiers; if(!quiet) toast("Fichiers supprimés"); return true;
}
async function bulkClean(){
  const elig=S.all.filter(o=>["livree","annulee"].includes(o.statut)&&liveFiles(o).length);
  const btn=$("#bulkYes"); if(btn){ btn.disabled=true; btn.textContent="Suppression…"; }
  let ok=0; for(const o of elig) if(await deleteFiles(o,true)) ok++;
  S.confirm=null; toast(ok===elig.length?`Fichiers supprimés pour ${ok} commande${ok>1?"s":""}`:`${ok} commande(s) nettoyée(s) sur ${elig.length}`); loadOrders();
}
async function deleteOrder(o){
  if(liveFiles(o).length){ const {error}=await sb.storage.from("fichiers").remove(liveFiles(o).map(f=>f.path)); if(error){ toast("Les fichiers n'ont pas pu être supprimés"); return; } }
  const {error}=await sb.from("commandes").delete().eq("id",o.id);
  if(error){ toast("La suppression a échoué"); return; }
  S.sel=null; S.confirm=null; toast("Commande supprimée"); loadOrders();
}

/* ---------- Téléchargements ---------- */
async function fetchFile(f){ const {data,error}=await sb.storage.from("fichiers").download(f.path); if(error) throw error; return data; }
async function downloadFile(f,btn){ btn.disabled=true; try{ saveBlob(f.nom,await fetchFile(f)); }catch(e){ toast("Fichier introuvable sur le serveur"); } btn.disabled=false; }
async function downloadZip(o,btn){ btn.disabled=true; const old=btn.innerHTML; btn.textContent="Préparation…";
  try{ const z=new JSZip(), used={};
    for(const f of liveFiles(o)){ let n=f.nom; if(used[n]) n=n.replace(/(\.[^.]+)?$/,`-${++used[f.nom]}$1`); else used[n]=1; z.file(n,await fetchFile(f)); }
    saveBlob(`${o.num}-fichiers.zip`, await z.generateAsync({type:"blob"}));
  }catch(e){ toast("L'archive n'a pas pu être préparée"); }
  btn.innerHTML=old; btn.disabled=false; }

/* ---------- Fiche PDF ---------- */
function buildPdf(o){
  const { jsPDF } = window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=16, ink=[24,33,46], gray=[110,118,132], acc=[28,93,140], line=[214,219,226];
  try{ doc.addImage(LOGO_PNG,"PNG",M,13,20,20); }catch(e){}
  doc.setTextColor(...gray); doc.setFont("helvetica","bold"); doc.setFontSize(7.5);
  doc.text("ÉGLISE ADVENTISTE DU SEPTIÈME JOUR · GUADELOUPE",M+25,18.5,{charSpace:.3});
  doc.setTextColor(...ink); doc.setFontSize(16); doc.text("Service Imprimerie",M+25,25.5);
  doc.setTextColor(...acc); doc.text("FACSA",M+25+doc.getTextWidth("Service Imprimerie "),25.5);
  doc.setTextColor(...gray); doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.text("Fiche de commande",M+25,31);
  doc.setDrawColor(...ink); doc.setLineWidth(.4); doc.roundedRect(W-M-58,12,58,22,1.5,1.5);
  doc.setFontSize(7); doc.setFont("helvetica","bold"); doc.setTextColor(...gray); doc.text("N° DE COMMANDE",W-M-54,18,{charSpace:.3});
  doc.setFont("courier","bold"); doc.setFontSize(12.5); doc.setTextColor(...ink); doc.text(o.num,W-M-54,25);
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...gray); doc.text("Reçue le "+fmtDateTime(o.creeLe),W-M-54,30.5);
  doc.setDrawColor(...ink); doc.setLineWidth(.8); doc.line(M,40,W-M,40);
  let y=50;
  const label=(t,x,yy)=>{ doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(...gray); doc.text(t.toUpperCase(),x,yy,{charSpace:.3}); };
  const val=(t,x,yy,w,size=11)=>{ doc.setFont("helvetica","bold"); doc.setFontSize(size); doc.setTextColor(...ink); const L=doc.splitTextToSize(String(t||"—"),w); doc.text(L,x,yy); return L.length; };
  label("Commanditaire",M,y); val(o.commanditaire,M,y+6,W-2*M,14); y+=17;
  const col=(W-2*M)/3;
  const grid=[[["Type de travaux",typeLabel(o)],["Quantité",qtyFmt(o.quantite).replace(/ | /g," ")+" exemplaires"],["Livraison souhaitée",fmtDate(o.dateLivraison)]],
              [["Personne à contacter",o.responsable],["Téléphone / e-mail",o.contact],["Statut",STATUTS[o.statut]?.l]]];
  for(const row of grid){ let maxL=1; row.forEach(([k,v],i)=>{ label(k,M+i*col,y); maxL=Math.max(maxL,val(v,M+i*col,y+5.5,col-6)); }); y+=8+maxL*5; doc.setDrawColor(...line); doc.setLineWidth(.2); doc.line(M,y,W-M,y); y+=7; }
  label("Format et support",M,y); y+=5.5; y+=val(o.format,M,y,W-2*M,10.5)*5+4;
  label("Description",M,y); y+=3;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); const dl=doc.splitTextToSize(o.description||"Aucune description.",W-2*M-8).slice(0,18);
  const bh=Math.max(16,dl.length*4.6+8);
  doc.setFillColor(245,246,248); doc.setDrawColor(...line); doc.roundedRect(M,y,W-2*M,bh,1.5,1.5,"FD");
  doc.setTextColor(...ink); doc.text(dl,M+4,y+6.5); y+=bh+8;
  const fl=o.fichiers||[];
  label(`Fichiers joints (${fl.length})`,M,y); y+=5.5;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...ink);
  if(fl.length){ fl.slice(0,8).forEach(f=>{ doc.text("•  "+f.nom+"   ("+fmtSize(f.taille)+")"+(f.supprime?" — supprimé":""),M+1,y); y+=5; }); if(fl.length>8){ doc.text(`… et ${fl.length-8} autre(s)`,M+1,y); y+=5; } }
  else { doc.text("Aucun fichier.",M+1,y); y+=5; }
  if(o.note){ y+=4; label("Note de l'imprimerie",M,y); y+=5.5; doc.setFont("helvetica","normal"); doc.setFontSize(9.5); const nl=doc.splitTextToSize(o.note,W-2*M).slice(0,5); doc.text(nl,M,y); y+=nl.length*4.6; }
  const by=Math.max(y+8,232), bw=(W-2*M-8)/3;
  [["Prise en charge","Date / par"],["Réalisation","Date / par"],["Livraison","Date et signature du client"]].forEach(([t,s],i)=>{
    const x=M+i*(bw+4); doc.setDrawColor(...ink); doc.setLineWidth(.3); doc.rect(x,by,bw,34);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(...ink); doc.text(t,x+3,by+6);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...gray); doc.text(s,x+3,by+10.5); });
  doc.setDrawColor(...line); doc.setLineWidth(.2); doc.line(M,283,W-M,283);
  doc.setFontSize(7.5); doc.setTextColor(...gray); doc.text("Service Imprimerie FACSA — Église adventiste du Septième jour, Guadeloupe",M,288);
  doc.text("Fiche éditée le "+new Date().toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}),W-M,288,{align:"right"});
  return doc;
}
function savePdf(o){ try{ buildPdf(o).save(`Fiche-${o.num}.pdf`); }catch(e){ console.error(e); toast("La fiche n'a pas pu être générée"); } }
function printPdf(o){
  try{ const doc=buildPdf(o); doc.autoPrint(); const w=window.open(doc.output("bloburl"),"_blank");
    if(!w){ doc.save(`Fiche-${o.num}.pdf`); toast("Fenêtre bloquée : la fiche a été téléchargée pour impression"); } }
  catch(e){ console.error(e); toast("La fiche n'a pas pu être générée"); }
}

/* ---------- Démarrage ---------- */
async function init(){
  renderLogo();
  if(location.hash==="#imprimerie") S.tab="login";
  if(CONFIGURED && window.supabase){
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    sb.auth.onAuthStateChange((ev,session)=>{
      if(ev==="PASSWORD_RECOVERY"){ S.recovery=true; S.tab="login"; }
      if(ev==="INITIAL_SESSION") return;
      setTimeout(()=>handleSession(session),0);
    });
    const sv=new URLSearchParams(location.search).get("suivi");
    if(sv){ S.tab="mine"; if(await addTracking(sv)) history.replaceState(null,"",location.pathname); }
    const {data}=await sb.auth.getSession();
    S.ready=true; await handleSession(data.session);
  } else { S.ready=true; render(); }
}
render(); init();
</script>
